name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call: # reused by publish.yml to gate on the exact SHA it publishes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking compares against main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate code (pinned toolchain)
        run: pnpm run generate

      - name: Generated code is committed and fresh
        run: git diff --exit-code

      - name: buf lint
        run: pnpm exec buf lint

      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            pnpm exec buf breaking --against '.git#branch=origin/main'
          else
            echo "no buf.yaml on main yet - skipping"
          fi

      - name: Cache pinned upstream protos
        uses: actions/cache@v4
        with:
          path: .upstream-cache
          key: upstream-${{ hashFiles('upstream.json') }}

      - name: Upstream coverage gate (pinned)
        run: .venv/bin/python scripts/upstream_coverage.py --mode pinned --cache-dir .upstream-cache

      - name: Reply coverage gate (CarServer.Response)
        run: .venv/bin/python scripts/check_reply_coverage.py

      - name: Protobuf surface catalog tests
        run: .venv/bin/python -m unittest scripts/test_build_catalog.py

      - name: Regenerate protobuf surface catalog
        run: .venv/bin/python scripts/build_catalog.py

      - name: Catalog is committed and fresh (drift + group registration)
        run: git diff --exit-code -- catalog/

      - name: Build TypeScript package
        run: pnpm run build

      - name: Typecheck
        run: pnpm run tsc

      - name: Golden fixture tests (TypeScript)
        run: node --test 'packages/typescript/test/*.test.ts'

      - name: Golden fixture tests (Python)
        run: PYTHONPATH=packages/python .venv/bin/python -m unittest discover -s packages/python/tests

      - name: Build Python distribution
        run: .venv/bin/python -m build --outdir packages/python/dist packages/python

      - name: twine check
        run: .venv/bin/twine check packages/python/dist/*

  # The build job runs one protobuf version; this job proves the range declared
  # in packages/python/pyproject.toml is honest. Generated code is committed (and
  # the build job verifies it is fresh), so this only needs runtime deps.
  python-runtime:
    name: Python runtime (protobuf ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: "protobuf==6.33.5"
            label: "6.33.5, declared floor"
          - spec: "protobuf==6.33.6"
            label: "6.33.6, Home Assistant constraint"
          - spec: "protobuf>=7,<8"
            label: "latest 7.x"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install published runtime dependencies only
        run: pip install "${{ matrix.spec }}" "googleapis-common-protos>=1.60"

      - name: Show resolved runtime
        run: python -c "import google.protobuf as p; print('protobuf', p.__version__)"

      - name: Gencode loads under this runtime
        run: python scripts/check_gencode_runtime.py

      - name: Golden fixture tests (Python)
        run: PYTHONPATH=packages/python python -m unittest discover -s packages/python/tests
