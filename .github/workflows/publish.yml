name: Publish

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci:
    name: CI (exact publish SHA)
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # version PR commits + git tags
      pull-requests: write # the Version PR
      id-token: write # npm OIDC trusted publishing
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-go@v5 # pnpm run generate builds protoc-gen-go
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1

      - name: Generated code is fresh
        run: pnpm run generate && git diff --exit-code

      - name: Build
        run: pnpm run build

      - name: Create Version PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version # changeset version + pyproject.toml sync
          publish: pnpm run ci:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  publish-pypi:
    name: Publish to PyPI
    needs: [ci, release]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # PyPI OIDC trusted publishing - the only permission
    steps:
      - uses: actions/checkout@v4 # same merge SHA: versions already bumped

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distribution
        run: |
          python -m pip install build twine
          python -m build --outdir packages/python/dist packages/python

      - name: twine check
        run: twine check packages/python/dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
          skip-existing: true # idempotent re-runs / partial-failure recovery

  # Go modules publish by git tag: go/vX.Y.Z on the same merge SHA marks the
  # go/ module at the version npm and PyPI just shipped.
  publish-go:
    name: Publish Go module tag
    needs: [ci, release]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # push the go/vX.Y.Z tag
    steps:
      - uses: actions/checkout@v4 # same merge SHA: versions already bumped

      - name: Tag go/vX.Y.Z
        id: tag
        run: |
          version="$(node -p 'require("./packages/typescript/package.json").version')"
          tag="go/v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "module=$(sed -n 's/^module //p' go/go.mod)@v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already pushed"  # idempotent re-runs
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Fetch through the Go module proxy
        run: go list -m "${{ steps.tag.outputs.module }}"
        working-directory: ${{ runner.temp }}
        env:
          GOPROXY: https://proxy.golang.org
