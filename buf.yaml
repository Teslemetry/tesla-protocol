version: v2
modules:
  - path: proto/command
  - path: proto/telemetry
  - path: proto/energy_device
  - path: proto/energy_command
  - path: proto/teslapower
  - path: proto/charging
  - path: proto/dashcam
lint:
  # Tesla's upstream style (package CarServer, enum value SpeedLimit, file-level
  # layout) violates buf's naming rules; we inherit their style, we don't fix it.
  use:
    - MINIMAL
  except:
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - WIRE_JSON
  # This repo deliberately reserves a field with a reason comment while its
  # payload type isn't yet published, then later un-reserves and models it
  # (see AGENTS.md). That's a wire-compatible addition, not tag reuse, but it
  # trips this rule every time, so it's excepted repo-wide rather than per-PR.
  except:
    - RESERVED_MESSAGE_NO_DELETE
  # Temporary: this major release corrects field names (same tags, new names),
  # moves fields into oneofs, gives int32 fields their enum types and makes
  # PartnerInfo.site_relationship_type repeated. These rules flag that. Delete
  # this block in the first PR after this release is published.
  ignore_only:
    FIELD_SAME_JSON_NAME:
      - proto/command/errors.proto
      - proto/command/vcsec.proto
      - proto/energy_device/device.proto
      - proto/energy_device/energy.proto
    FIELD_SAME_NAME:
      - proto/command/errors.proto
      - proto/command/vcsec.proto
      - proto/energy_device/device.proto
      - proto/energy_device/energy.proto
      - proto/energy_device/networking.proto
    FIELD_SAME_ONEOF:
      - proto/command/errors.proto
    FIELD_WIRE_JSON_COMPATIBLE_TYPE:
      - proto/energy_device/common_api.proto
      - proto/energy_device/registration_api.proto
      - proto/energy_device/update.proto
    FIELD_WIRE_JSON_COMPATIBLE_CARDINALITY:
      - proto/energy_device/registration_api.proto
