version: v2
modules:
  - path: proto/command
  - path: proto/telemetry
  - path: proto/energy_device
  - path: proto/energy_command
  - path: proto/teslapower
  - path: proto/charging
  - path: proto/dashcam
lint:
  # Tesla's upstream style (package CarServer, enum value SpeedLimit, file-level
  # layout) violates buf's naming rules; we inherit their style, we don't fix it.
  use:
    - MINIMAL
  except:
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - WIRE_JSON
  # This repo deliberately reserves a field with a reason comment while its
  # payload type isn't yet published, then later un-reserves and models it
  # (see AGENTS.md). That's a wire-compatible addition, not tag reuse, but it
  # trips this rule every time, so it's excepted repo-wide rather than per-PR.
  except:
    - RESERVED_MESSAGE_NO_DELETE
  # Temporary: this patch release mirrors fleet-telemetry PR 572's final
  # content, which renames, removes and renumbers Field 272-278 and drops
  # Value.cruise_state_value (56) as published by the PR's first version.
  # These rules flag that. Delete this block in the first PR after this
  # release is published.
  ignore_only:
    ENUM_VALUE_NO_DELETE_UNLESS_NAME_RESERVED:
      - proto/telemetry/vehicle_data.proto
    ENUM_VALUE_NO_DELETE_UNLESS_NUMBER_RESERVED:
      - proto/telemetry/vehicle_data.proto
    ENUM_VALUE_SAME_NAME:
      - proto/telemetry/vehicle_data.proto
    FIELD_NO_DELETE_UNLESS_NAME_RESERVED:
      - proto/telemetry/vehicle_data.proto
    FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED:
      - proto/telemetry/vehicle_data.proto
