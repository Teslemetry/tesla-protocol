}

message WCAccessControlEntry {
  VIN vin                            = 1;
  string name                        = 2;
  WCTeslaVehicleModel model          = 3;
  uint32 model_year                  = 4;
  WCTeslaVehicleDriveType drive_type = 5;
}

message WCChargeScheduleTimePeriod {
  uint32 start_seconds = 1;
  uint32 end_seconds   = 2;
}

message WCChargeScheduleDayTimePeriods {
  repeated WCChargeScheduleTimePeriod time_periods = 1;
  uint32 day_bitmask                               = 2; // bitmask of WCChargeScheduleDay values
}

message WCChargeSchedule {
  repeated WCChargeScheduleDayTimePeriods day_time_periods = 1;
