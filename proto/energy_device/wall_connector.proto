message WCFaultStatusLatchedAlert {
  uint32 alert_id                           = 1;
  google.protobuf.Timestamp alert_timestamp = 2;
}

message WCVitals {
  uint32 uptime_s                                                       = 1;
  repeated uint32 alerts                                                = 2;
  bool contactor_closed                                                 = 3;
  bool vehicle_connected                                                = 4;
  float pcba_temp_c                                                     = 5;
  float handle_temp_c                                                   = 6;
  float mcu_temp_c                                                      = 7;
  float input_thermopile_v                                              = 8;
  float prox_v                                                          = 9;
  float pilot_high_v                                                    = 10;
  float pilot_low_v                                                     = 11;
  uint32 session_duration_s                                             = 12;
  AccumulatedEnergy session_energy                                      = 13;
  InstACMeasurement ac_measurement_grid                                 = 14;
  InstACMeasurement ac_measurement_vehicle                              = 15;
  float ground_resistance_ohms                                          = 16;
  float line1_earth_vrms                                                = 17;
  float neutral_earth_vrms                                              = 18;
  WCFaultStatusState fault_status                                       = 19;
  repeated WCFaultStatusLatchedAlert recent_fault_status_latched_alerts = 20;
  VIN vin                                                               = 21;
  google.protobuf.FloatValue instantaneous_power_watts                  = 22;
  WCChargeScheduleChargingStatus scheduled_charging_status              = 23;
  google.protobuf.FloatValue instantaneous_line_current                 = 24;
  WCOcppStatus ocpp_status                                              = 25;
  repeated WCEvseNotReadyReason evse_not_ready_reasons                  = 26;
  WCPowershareSessionState powershare_session_state                     = 27;
  WCDryContactControlState dry_contact_control_state                   = 28;
  WCSmartChargingReason smart_charging_reason                          = 29;
}

message WCLifetimeStats {
  reserved 1, 2;
  uint64 uptime_s                   = 3;
  uint32 alert_count                = 4;
  uint32 contactor_cycles           = 5;
  uint32 contactor_cycles_loaded    = 6;
  uint32 connector_cycles           = 7;
  uint32 thermal_foldbacks          = 8;
  float avg_startup_temp_c          = 9;
  uint32 charge_starts              = 10;
  uint64 charging_time_s            = 11;
  AccumulatedEnergy charging_energy = 12;
}

message WCLoadSharingFixedLimitConfig {
  uint32 network_limit_amps = 1;
}

message WCLoadSharingConductorLimitConfig {
  uint32 conductor_limit_amps = 1;
}

message WCLoadSharingSettings {
  WCLoadSharingFixedLimitConfig fixed_limit         = 1;
  WCLoadSharingConductorLimitConfig conductor_limit = 2;
}

message WCLoadSharingLimits {
  uint32 max_participants = 1;
}

message WCLoadSharingNetworkStatus {
  repeated WCLoadSharingNetworkChargingInhibitor network_charging_inhibitors = 1;
}

message WCLoadSharingConfig {
  uint32 version                            = 1;
  repeated Din participant_dins             = 2;
  WCLoadSharingFixedLimitConfig fixed_limit = 3;
  WCLoadSharingSettings settings            = 4;
  bool charging_enabled                     = 5;
}

message WCPpuConfig {
  WCPpuSessionReportingMode session_reporting_mode = 1;
}

message WCOperationalSettingsConfig {
  WCOperationalMode operational_mode = 1;
  bool emit_increased_telemetry      = 2;
}

message WCMeterInterface {
  NeurioMeterInterface neurio = 1;
}

message WCDryContactConfig {
  bool enabled                           = 1;
  WCDryContactDefaultState default_state = 2;
  bool disable_charging                  = 3;
  uint32 max_current_amps                = 4;
  bool germany_14a                       = 5;
}

message WCTimeZoneTransition {
  google.protobuf.Timestamp timestamp = 1;
  int32 local_time_utc_offset         = 2;
}

message WCTimeZoneInfo {
  repeated WCTimeZoneTransition transitions = 1;
}

message WCTimeZone {
  string time_zone_id           = 1;
  WCTimeZoneInfo time_zone_info = 2;
}

message WCMIDConfig {
  bool enabled         = 1;
  WCTimeZone time_zone = 2;
}

message WCSettings {
  int32 max_output_current_amps                    = 1;
  WCGroundMonitorMode gmi_mode                     = 2;
  string country                                   = 3;
  WCThirdPartyVehicleMode third_party_vehicle_mode = 4;
  WCLoadSharingConfig load_sharing_config          = 5;
  WCDryContactConfig dry_contact                   = 6;
  WCMIDConfig mid_config                           = 7;
}

message WCGenealogy {
  uint32 region            = 1;
  uint32 handle_type       = 2;
  uint32 hardware_features = 3;
  uint32 sub_usage_id      = 4;
}

message ComplianceCRC32 {
  string name  = 1;
  uint32 crc32 = 2;
}

message WCLoadSharingFollowerState {
  uint32 version                       = 1;
  bool charge_request                  = 2;
  float load_current_amps              = 3;
  bool vehicle_connected               = 4;
  uint32 alert_count                   = 5;
  bool contactor_closed                = 6;
  reserved 7;
  uint32 pilot_current_amps            = 8;
  uint32 individual_pilot_current_amps = 9;
}

message WCLoadSharingLeaderCommand {
  bool charge_allowed       = 1;
  uint32 pilot_current_amps = 2;
}

message WCLoadSharingLeaderState {
  uint32 version                    = 1;
  uint32 network_current_limit_amps = 2;
  uint32 fallback_current_amps      = 3;
  uint32 round_robin_index          = 4;
  bool charging_enabled             = 5;
  uint32 active_unit_count          = 6;
}

message WCLoadSharingDeviceEntry {
  Din din                                   = 1;
  WCLoadSharingLeaderCommand leader_command = 2;
  WCLoadSharingFollowerState follower_state = 3;
  bool mia                                  = 4;
}

message WCLoadSharingNetworkState {
  repeated WCLoadSharingDeviceEntry devices = 1;
  WCLoadSharingLeaderState leader_state     = 2;
  WCLoadSharingSettings settings            = 3;
  WCLoadSharingNetworkStatus status         = 4;
  WCLoadSharingLimits limits                = 5;
}

message WCProvisionalOperationalParams {
  uint32 limit_current_max_amps = 1;
  uint32 limit_timeout_s        = 2;
