}

message WCOcppSettings {
  string connection_url             = 1;
  string chargepoint_id             = 2;
  WCOcppVersion version              = 3;
  WCOcppSecurityProfile security_profile = 4;
  bool enable                       = 5;
  string provider_name              = 6;
  WCOcppScope scope                  = 7;
}

message WCOcppAuthorizationData {
  string id_tag = 1;
}

message WCOcppAuthorizationList {
  repeated WCOcppAuthorizationData auth_data = 1;
}

message WCVehicleToHomeConfig {
  Din site_controller_din = 1;
