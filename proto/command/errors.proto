// UPSTREAM-SOURCE: teslamotors/vehicle-command
// UPSTREAM-PATH:   pkg/protocol/protobuf/errors.proto
// UPSTREAM-COMMIT: see upstream.json
// This file = upstream base + Teslemetry extensions marked TESLEMETRY-EXT.
syntax = "proto3";

package Errors;

option go_package = "github.com/teslamotors/vehicle-command/pkg/protocol/protobuf/errors";
option java_package = "com.tesla.generated.errors";

enum GenericError_E
{
    GENERICERROR_NONE = 0;
    GENERICERROR_UNKNOWN = 1;
    GENERICERROR_CLOSURES_OPEN = 2;
    GENERICERROR_ALREADY_ON = 3;
    GENERICERROR_DISABLED_FOR_USER_COMMAND = 4;
    GENERICERROR_VEHICLE_NOT_IN_PARK = 5;
    GENERICERROR_UNAUTHORIZED = 6;
    GENERICERROR_NOT_ALLOWED_OVER_TRANSPORT = 7;
    GENERICERROR_KEY_NOT_FOUND = 8;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
    GENERICERROR_NOT_SUPPORTED = 9;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
}

// ===== TESLEMETRY-EXT BEGIN =====
// UNCONFIRMED: not yet confirmed on a live vehicle; names not recovered.
message KeyNotFoundContext {
    bytes  public_key = 1;
    uint32 handle     = 2;
}
// ===== TESLEMETRY-EXT END =====

message NominalError {
    GenericError_E  genericError = 1;
    KeyNotFoundContext keyNotFoundContext = 8;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle; name not recovered
}
