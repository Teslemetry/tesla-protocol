enum SignatureType
{
    SIGNATURE_TYPE_NONE = 0;
    SIGNATURE_TYPE_ECDSA = 1;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
    SIGNATURE_TYPE_PRESENT_KEY  = 2;
    SIGNATURE_TYPE_AES_GCM_TOKEN = 3;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
    SIGNATURE_TYPE_UNSIGNED = 4;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
}

message SignedMessage {
    bytes protobufMessageAsBytes = 2;
    SignatureType signatureType = 3;
    bytes token = 1;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
    bytes signature = 4;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
    bytes keyId = 5;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
    uint32 counter = 6;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
}

message ToVCSECMessage {
    SignedMessage signedMessage = 1;
    UnsignedMessage unsignedMessage = 2;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
}

message KeyIdentifier {
    bytes publicKeySHA1 = 1;
}

