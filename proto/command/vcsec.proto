message WhitelistInfo {
    uint32                      numberOfEntries = 1;
    repeated KeyIdentifier      whitelistEntries = 2;
    uint32                      slotMask = 3;
}

message WhitelistEntryInfo {
    KeyIdentifier                           keyId = 1;
    PublicKey                               publicKey = 2;
    KeyMetadata                             metadataForKey = 4;
    uint32                                  slot = 6;
    repeated WhitelistKeyPermission_E       permissions = 3;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
    uint32                                  secondsEntryRemainsActive = 5;  // TESLEMETRY-EXT UNCONFIRMED: not yet confirmed on a live vehicle
    Keys.Role                               keyRole = 7;
}

message InformationRequest {
    InformationRequestType      informationRequestType = 1;
    oneof key {
        KeyIdentifier keyId = 2;
        bytes         publicKey = 3;
        uint32        slot = 4;
    }
}

