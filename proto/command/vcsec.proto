    INFORMATION_REQUEST_TYPE_GET_KEYSTATUS_INFO = 8;  // TESLEMETRY-EXT
    INFORMATION_REQUEST_TYPE_GET_ACTIVE_KEY = 9;  // TESLEMETRY-EXT
