message SetRateTariffRequest {
  message TOUPeriod {
    int32 from_day_of_week = 1;
    int32 to_day_of_week = 2;
    int32 from_hour = 3;
    int32 from_minute = 4;
    int32 to_hour = 5;
    int32 to_minute = 6;
  }

  message TOUPeriods {
    repeated TOUPeriod ON_PEAK = 1;
    repeated TOUPeriod PARTIAL_PEAK = 2;
    repeated TOUPeriod OFF_PEAK = 3;
    repeated TOUPeriod SUPER_OFF_PEAK = 4;
  }

  message Season {
    int32 from_day = 1;
    int32 to_day = 2;
    int32 from_month = 3;
    int32 to_month = 4;
    TOUPeriods tou_periods = 5;
  }

  message Seasons {
    Season Summer = 1;
    Season Winter = 2;
    Season Season3 = 3;
    Season Season4 = 4;
    Season Season5 = 5;
  }

  message FixedCharge {
    double ALL = 1;
  }

  message RateBand {
    double ALL = 1;
    double ON_PEAK = 2;
    double PARTIAL_PEAK = 3;
    double OFF_PEAK = 4;
    double SUPER_OFF_PEAK = 5;
  }

  message Charges {
    FixedCharge ALL = 1;
    RateBand Summer = 2;
    RateBand Winter = 3;
    RateBand Season3 = 4;
    RateBand Season4 = 5;
    RateBand Season5 = 6;
  }

  // secondary tariff document embedded in the primary one
  message Tariff {
    Seasons seasons = 13;
  }

  Seasons seasons = 13;
  Tariff tariff = 14;
}

